input {
  file {
    path => "/usr/share/logstash/sample_logs/*"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  # [1단계] Syslog 표준 형식 검증
  if [message] !~ /^<\d+>/ {
    mutate { add_tag => ["_error_format", "_error"] }
  }

  # [2단계] Dissect 파싱 (이전 단계 에러가 없을 때만 실행)
  if "_error" not in [tags] {
    dissect {
      mapping => {
        "message" => "<%{syslog_pri}>%{syslog_ver} %{syslog_timestamp} [%{log_action}] [%{device_ip}] %{kv_data}"
      }
      tag_on_failure => ["_error_dissect", "_error"]
    }
  }

  # [3단계] Key-Value 파싱 (이전 단계 에러가 없을 때만 실행)
  if "_error" not in [tags] {
    kv {
      source => "kv_data"
      field_split => " "
      value_split => "="
      remove_char_value => "\"'"
      whitespace => "strict"
      tag_on_failure => ["_error_kv", "_error"]
    }
  }

  # [4단계] 데이터 타입 변환 및 유효성 검증
  if "_error" not in [tags] {
    mutate {
      convert => {
        "src_port" => "integer"
        "dst_port" => "integer"
        "bytes_total" => "integer"
        "packets_total" => "integer"
      }
    }

    if [bytes_total] < 0 or [packets_total] < 0 {
      mutate { add_tag => ["_error_data", "_error"] }
    }
  }

  # [5단계] 날짜 파싱 및 세션 집계 (Aggregate)
  if "_error" not in [tags] {
    date {
      match => [ "end_time", "yyyy-MM-dd HH:mm:ss" ]
      target => "@timestamp"
      timezone => "UTC"
    }

    aggregate {
      task_id => "%{src_ip}_%{dst_ip}_%{dst_port}"
      timeout => 20
      timeout_tags => ['aggregated']

      # 서버 시간이 아닌 로그 내부의 시간(@timestamp)을 기준으로 20초 타임아웃 계산
      timeout_timestamp_field => "@timestamp"

      timeout_tags => ['aggregated']

      code => "
        map['src_ip'] ||= event.get('src_ip')
        map['dst_ip'] ||= event.get('dst_ip')
        map['dst_port'] ||= event.get('dst_port')
        map['protocol'] ||= event.get('protocol')
        map['action'] ||= event.get('log_action')

        map['first_start_time'] ||= event.get('start_time')
        map['last_end_time'] = event.get('end_time')

        map['sum_bytes_total'] ||= 0
        map['sum_bytes_total'] += event.get('bytes_total').to_i

        map['sum_packets_total'] ||= 0
        map['sum_packets_total'] += event.get('packets_total').to_i

        map['event_count'] ||= 0
        map['event_count'] += 1
      "

      push_map_as_event_on_timeout => true
    }
  }

  # '집계 처리가 끝난 원본 개별 로그'만 깔끔하게 Drop
  if "_error" not in [tags] and "aggregated" not in [tags] {
    drop {}
  }
}

output {
  # 1. 에러 데이터는 원인별로 지정된 파일에 격리
  if "_error_format" in [tags] {
    file { path => "/usr/share/logstash/logs/invalid_format.log" codec => json_lines }
  } else if "_error_dissect" in [tags] {
    file { path => "/usr/share/logstash/logs/failed_dissect.log" codec => json_lines }
  } else if "_error_kv" in [tags] {
    file { path => "/usr/share/logstash/logs/failed_kv.log" codec => json_lines }
  } else if "_error_data" in [tags] {
    file { path => "/usr/share/logstash/logs/invalid_data.log" codec => json_lines }
  }
  
  # 2. 정상 집계 완료된 데이터 출력 제어
  else if "aggregated" in [tags] {
    
    # [Worker 1, 4, 8 속도 벤치마크 테스트 시 주석 처리 유지]
    # csv {
    #   path => "/usr/share/logstash/output/firewall_agg_result.csv"
    #   fields => [
    #     "src_ip", "dst_ip", "dst_port", "protocol", "action",
    #     "first_start_time", "last_end_time",
    #     "sum_bytes_total", "sum_packets_total", "event_count"
    #   ]
    # }

    # 순수 데이터 적재 성능 측정을 위한 Elasticsearch 출력 유지
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "firewall-agg-logs-%{+YYYY.MM.dd}"

      user => "elastic"
      password => "123456"

      template => "/usr/share/logstash/config/es_template.json"
      template_name => "firewall_benchmark_template"
      template_overwrite => true
    }
  }
}
